name: FastBite CI Pipeline

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout del código
      uses: actions/checkout@v3

    - name: Configurar Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.11'

    - name: Instalar dependencias
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt
        pip install pytest pytest-django pytest-cov flake8 black

    - name: Validar Formato (Format) con Black
      run: |
        black --check .

    - name: Validar Reglas (Lint) con Flake8
      run: |
        flake8 . --count --select=E9,F63,F7,F82 --show-source --statistics
        flake8 . --count --exit-zero --max-complexity=10 --max-line-length=127 --statistics

    - name: Ejecutar Pruebas (Testing) y Cobertura
      env:
        DJANGO_SETTINGS_MODULE: FastBite.settings
      run: |
        pytest --cov=. --cov-report=xml

    - name: Subir reporte de cobertura (Coverage.xml)
      uses: actions/upload-artifact@v3
      with:
        name: coverage-report
        path: coverage.xml